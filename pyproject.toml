[tool.poetry]
name = "online-cinema-backend"
version = "0.1.0"
description = "Online Cinema backend"
authors = ["Oleksii <domenik567@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = "^2.10"
pydantic-settings = "^2.7"
pyjwt = "^2.10"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-multipart = "^0.0.20"
celery = "^5.4"
redis = "^5.2"
jinja2 = "^3.1"
aiosmtplib = "^3.0"
boto3 = "^1.35"
stripe = "^11.4"
pillow = "^11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
httpx = "^0.28"
aiosqlite = "^0.20"
ruff = "^0.8"
black = "^24.10"
mypy = "^1.14"
faker = "^33.1"
polyfactory = "^2.18"
types-passlib = "^1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["stripe", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated tests with no external dependencies",
    "integration: tests touching the database",
    "e2e: tests driving the application through HTTP",
]

[tool.coverage.run]
source = ["src"]
omit = ["alembic/*", "src/__init__.py"]

[tool.coverage.report]
show_missing = true
