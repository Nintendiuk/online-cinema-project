<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account activated</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:Arial, Helvetica, sans-serif;">
  <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse:collapse; background-color:#ffffff; margin:40px auto; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
    <tr>
      <td style="padding:40px 30px; text-align:center;">
        <h1 style="margin:0 0 20px; font-size:24px; color:#333333;">Account activated</h1>
        <p style="margin:0 0 20px; font-size:16px; color:#555555; line-height:1.6;">
          Hello <strong>{{ email }}</strong>,<br>
          Your account has been successfully activated. You can now log in and start
          enjoying Online Cinema.
        </p>
        <!-- Call to action -->
        <table align="center" border="0" cellpadding="0" cellspacing="0" style="margin:0 auto 20px;">
          <tr>
            <td style="background-color:#007bff; border-radius:6px; padding:12px 30px;">
              <a href="{{ login_link }}" style="display:block; color:#ffffff; text-decoration:none; font-size:18px; font-weight:bold;">Log in</a>
            </td>
          </tr>
        </table>
        <!-- Plain-text fallback -->
        <p style="margin:0 0 10px; font-size:14px; color:#555555;">
          If the button does not work, copy this address into your browser:
        </p>
        <p style="margin:0 0 30px; font-size:14px; color:#007bff; word-break:break-all;">
          {{ login_link }}
        </p>
        <hr style="border:0; border-top:1px solid #e0e0e0; margin:30px 0;">
        <p style="margin:0; font-size:12px; color:#999999;">
          Thank you for joining Online Cinema.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
